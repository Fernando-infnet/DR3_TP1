# Configuracoes COMPARTILHADAS por todos os microservicos clientes do config-server.

# Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Intervalos curtos (padrao: 30s) para que um servico recem-iniciado seja
# encontrado rapidamente pelos outros durante a demonstracao.
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

# Chave secreta HMAC (HS256) usada para ASSINAR (auth-service) e VALIDAR
# (servicos protegidos) os tokens JWT. Minimo de 32 bytes.
# Em producao, definir via variavel de ambiente JWT_SECRET e nunca versionar.
jwt.secret=${JWT_SECRET:tp3-microsservicos-chave-secreta-jwt-hs256-com-pelo-menos-32-bytes}
jwt.issuer=auth-service

management.endpoints.web.exposure.include=health,info

# Cria as tabelas a partir do schema.sql de cada servico (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

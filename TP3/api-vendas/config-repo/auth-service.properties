server.port=9000

# Banco PROPRIO do servico de autenticacao (PostgreSQL, acesso via Spring Data JDBC)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/auth_db
spring.datasource.username=auth_user
spring.datasource.password=auth_pass

# Validade dos tokens (em segundos).
# Access token curto (5 min) para evidenciar a necessidade do refresh.
jwt.access-token-expiration=300
# Refresh token longo (24 h).
jwt.refresh-token-expiration=86400

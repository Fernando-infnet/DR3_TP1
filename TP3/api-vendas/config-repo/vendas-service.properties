server.port=8083

# Banco PROPRIO do servico de vendas (PostgreSQL, acesso reativo via Spring Data R2DBC)
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/vendas_db
spring.r2dbc.username=vendas_user
spring.r2dbc.password=vendas_pass

# Endereco do produtos-service: o nome logico e resolvido pelo Eureka
# (WebClient @LoadBalanced / Spring Cloud LoadBalancer)
produtos-service.url=http://produtos-service
produtos-service.timeout=3s

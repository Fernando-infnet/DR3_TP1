# Configuracao dos TESTES: substitui o application.properties principal.
# Nao depende do config-server nem do Eureka; o banco vem do Testcontainers e
# o produtos-service e simulado por um MockWebServer (ver VendaControllerIntegrationTest).
spring.application.name=vendas-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.sql.init.mode=always

jwt.secret=chave-secreta-de-teste-com-pelo-menos-32-bytes-hs256
jwt.issuer=auth-service

produtos-service.url=http://produtos-service
produtos-service.timeout=1s

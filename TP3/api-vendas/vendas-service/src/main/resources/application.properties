# Config minima local: nome da aplicacao (usado para buscar
# "vendas-service.properties" no config-server) e o endereco do config-server.
# O restante das configuracoes (porta, banco, eureka, jwt...) vem do
# config-server, em config-repo/application.properties e
# config-repo/vendas-service.properties.
spring.application.name=vendas-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Sobe todo o ambiente: docker compose up --build
services:
  # Um unico servidor PostgreSQL com TRES bancos isolados (auth_db, produtos_db,
  # vendas_db), cada um com usuario proprio -> ver docker/postgres-init/init.sql
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: file:/config-repo/
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 5s
      retries: 30

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761'"]
      interval: 5s
      retries: 30

  auth-service:
    build: ./auth-service
    ports:
      - "9000:9000"
    environment: &app-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  produtos-service:
    build: ./produtos-service
    ports:
      - "8082:8082"
    environment: *app-env
    depends_on: *app-deps

  vendas-service:
    build: ./vendas-service
    ports:
      - "8083:8083"
    environment: *app-env
    depends_on: *app-deps

volumes:
  postgres-data:

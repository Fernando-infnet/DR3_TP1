server.port=8888

spring.application.name=config-server

# Backend "native": le os arquivos de configuracao direto da pasta config-repo/
# do projeto (sem precisar de um repositorio Git separado). O caminho e relativo
# ao diretorio de onde o config-server e executado (config-server/). Pode ser
# sobrescrito pela variavel de ambiente CONFIG_REPO_PATH (ex.: no Docker).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:../config-repo/}

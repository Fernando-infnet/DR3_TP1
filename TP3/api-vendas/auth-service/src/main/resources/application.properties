# Config minima local: nome da aplicacao (usado para buscar
# "auth-service.properties" no config-server) e o endereco do config-server.
# O restante (porta, datasource, eureka, segredo e validade do JWT) vem de
# config-repo/application.properties e config-repo/auth-service.properties.
spring.application.name=auth-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

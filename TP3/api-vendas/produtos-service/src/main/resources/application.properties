# Config minima local: nome da aplicacao (usado para buscar
# "produtos-service.properties" no config-server) e o endereco do config-server.
# O restante das configuracoes (porta, datasource, eureka...) vem do
# config-server, em config-repo/application.properties e
# config-repo/produtos-service.properties.
spring.application.name=produtos-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - marketflow-postgres-data:/var/lib/postgresql/data

volumes:
  marketflow-postgres-data:
